name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Test
        run: cargo test --workspace --locked
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Install script help
        run: bash scripts/install.sh --help
      - name: Install script does not leak logs into paths
        run: |
          bash scripts/install.sh --self-test
          ! grep -E 'ROOT="\$\(|ensure_source|CARGO_INSTALL_HINT' scripts/install.sh
          ! grep -E -- '--git .*\-\-path|--path .*\-\-git' scripts/install.sh scripts/install.ps1
