[package]
name = "reco-desktop"
description = "Reco AI desktop window for Prueba (Tauri)"
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.83"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
reco-catalog = { path = "../../reco-catalog" }
reco-core = { path = "../../reco-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
clap = { version = "4.5", features = ["derive"] }
