<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Prueba — Reco AI</title>
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <aside>
      <div class="brand">
        <strong>Prueba</strong>
        <span>Reco AI</span>
      </div>
      <button type="button" id="new-chat">+ chat nuevo</button>
      <nav id="convos"></nav>
    </aside>
    <section class="main">
      <header>
        <div>
          <h1 id="model">Reco AI</h1>
          <p id="engine" class="dim"></p>
        </div>
      </header>
      <main id="log">
        <div class="empty" id="empty">
          Elige un modelo con <code>reco run</code> y escribe aquí.
        </div>
      </main>
      <footer>
        <form id="form">
          <textarea
            id="input"
            rows="1"
            placeholder="Mensaje…  Enter envía · Shift+Enter salto"
          ></textarea>
          <button type="submit">Enviar</button>
        </form>
      </footer>
    </section>
    <script src="app.js"></script>
  </body>
</html>
