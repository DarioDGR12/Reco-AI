[workspace]
resolver = "2"
members = ["crates/reco-core", "crates/reco-catalog", "crates/reco-cli"]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "MIT"
rust-version = "1.83"
repository = "https://github.com/DarioDGR12/Reco-AI"
homepage = "https://github.com/DarioDGR12/Reco-AI"
authors = ["Reco AI contributors"]

[workspace.dependencies]
reco-core = { path = "crates/reco-core", version = "0.3.0" }
reco-catalog = { path = "crates/reco-catalog", version = "0.3.0" }
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
dirs = "6.0"
owo-colors = "4.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sysinfo = "0.33"
nvml-wrapper = "0.11"
thiserror = "2.0"
ureq = { version = "2.12", features = ["json"] }
crossterm = "0.28"
ratatui = "0.29"
rusqlite = { version = "0.32", features = ["bundled"] }
tiny_http = "0.12"
getrandom = "0.2"
